<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; font-size: 13px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    select, textarea, button { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; font-family: inherit; }
    button { background: #4a6fa5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #3d5c8a; }
    #status { font-size: 12px; color: #16a34a; }
  </style>
</head>
<body>
  <p>Updating milestone for <strong><?= name ?></strong> (current: <?= currentStage ?>):</p>

  <label for="stage">New stage</label>
  <select id="stage">
    <? for (var i = 0; i < stages.length; i++) { ?>
      <option value="<?= stages[i] ?>" <?= stages[i] === currentStage ? 'selected' : '' ?>><?= stages[i] ?></option>
    <? } ?>
  </select>

  <label for="notes">Notes (optional)</label>
  <textarea id="notes" rows="3"></textarea>

  <button onclick="submitMilestone()">Update</button>
  <div id="status"></div>

  <script>
    function submitMilestone() {
      var stage = document.getElementById('stage').value;
      var notes = document.getElementById('notes').value;
      document.getElementById('status').textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (msg) { document.getElementById('status').textContent = msg; })
        .withFailureHandler(function (err) { document.getElementById('status').textContent = 'Error: ' + err.message; })
        .advanceMilestone(<?= rowNum ?>, stage, notes);
    }
  </script>
</body>
</html>
